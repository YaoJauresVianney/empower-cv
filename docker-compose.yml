services:

  # ── Laravel API (PHP-FPM) ────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: empower_api
    volumes:
      - ./api:/var/www/html
      - vendor:/var/www/html/vendor        # vendor isolé du host
    env_file:
      - ./api/.env                         # reprend APP_KEY, GROQ_API_KEY, etc.
    environment:
      APP_URL: http://localhost:8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - empower
    restart: unless-stopped

  # ── Nginx (reverse-proxy vers PHP-FPM) ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: empower_nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - empower
    restart: unless-stopped

  # ── React / Vite ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: empower_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules     # node_modules isolé du host
    networks:
      - empower
    restart: unless-stopped

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: empower_mysql
    ports:
      - "3307:3306"                        # 3307 pour éviter le conflit avec Herd (3306)
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: empower-cv
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - empower
    restart: unless-stopped

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: empower_redis
    ports:
      - "6379:6379"
    networks:
      - empower
    restart: unless-stopped

networks:
  empower:
    driver: bridge

volumes:
  mysql_data:
  vendor:
  node_modules:
